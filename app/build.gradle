plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// The sample app needs a real site token to load real content. It lives in
// local.properties, which is gitignored, so no credential reaches a commit.
// Add a line like:  fanmakerSiteToken=<token>
def sampleProps = new Properties()
def samplePropsFile = rootProject.file('local.properties')
if (samplePropsFile.exists()) { samplePropsFile.withInputStream { sampleProps.load(it) } }
def fanmakerSiteToken = sampleProps.getProperty('fanmakerSiteToken', '<SDK_KEY_1>')

android {
    namespace 'com.example.turducken'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.turducken"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "FANMAKER_SITE_TOKEN", "\"${fanmakerSiteToken}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Minified build type. The SDK ships consumer-rules.pro, but nothing in
        // this repo ever ran R8, so no keep rule was ever exercised and
        // consumer-rules.pro sat empty and unnoticed. This build type is the
        // regression harness for that: it minifies, and it is debug-signed so
        // it installs on a device without release keys.
        minified {
            initWith release
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        compose = true
        viewBinding = true  // Keep for existing Views during migration
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }

    lint {
        disable 'UsingOnClickInXml'
    }
}

dependencies {
    // Compose BOM 2024.12.01
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'

    // Updated AndroidX dependencies
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'
    // ./gradlew -PuseLocalSdk ... builds against the SDK sources in this repo
    // instead of the published AAR, so SDK changes can be verified end to end.
    if (project.hasProperty('useLocalSdk')) {
        implementation project(':FanMaker')
    } else {
        implementation 'com.fanmaker.sdk:fanmaker:4.0.3'
    }

    // Updated test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Compose testing - temporarily commented out
    // androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'org.altbeacon:android-beacon-library:2.19.6'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
}
